---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn
  namespace: longhorn-system
  labels:
    app: longhorn
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`longhorn.apps.lab.lan`)
      kind: Rule
      services:
        - name: longhorn-frontend
          port: 80
