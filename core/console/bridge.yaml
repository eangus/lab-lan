# Only supports x86_64v3
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: console-sa
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-sa-admin
subjects:
  - kind: ServiceAccount
    name: console-sa
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshift-console
  namespace: kube-system
  labels:
    app: openshift-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openshift-console
  template:
    metadata:
      labels:
        app: openshift-console
    spec:
      serviceAccountName: console-sa
      containers:
        - name: console
          image: quay.io/openshift/origin-console:latest
          ports:
            - containerPort: 9000
              name: http
          command:
            - /opt/bridge/bin/bridge
            - -k8s-mode=off-cluster
            - -k8s-auth=bearer-token
            - -listen=http://0.0.0
            - -public-dir=/opt/bridge/static
          env:
            # Dynamically discovers the K3s internal API endpoint
            - name: BRIDGE_K8S_MODE_OFF_CLUSTER_ENDPOINT
              value: "https://default.svc"
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: openshift-console-service
  namespace: kube-system
spec:
  ports:
    - name: http
      port: 9000
      targetPort: 9000
  selector:
    app: openshift-console
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openshift-console-ingress
  namespace: kube-system
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`console.apps.lab.lan`)
      kind: Rule
      services:
        - name: openshift-console-service
          port: 9000
