---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app: argocd

---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: argocd-operator
  namespace: argocd

---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: argocd-operator
  namespace: argocd
spec:
  config:
    env: 
    - name: ARGOCD_CLUSTER_CONFIG_NAMESPACES
      value: '*'
  channel: alpha
  name: argocd-operator
  source: operator-catalog
  sourceNamespace: olm

---
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: argocd
  namespace: argocd
spec:
  server:
    insecure: true
    route:
      enabled: true
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
  defaultClusterScopedRoleDisabled: false
