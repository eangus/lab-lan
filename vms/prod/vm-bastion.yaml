---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: bastion
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/size: small
        kubevirt.io/domain: bastion
    spec:
      domain:
        devices:
          disks:
            - disk:
                bus: virtio
              name: containerdisk
            - disk:
                bus: virtio
              name: cloudinitdisk
          rng: {}
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            memory: 4Gi
            cpu: "2"
      terminationGracePeriodSeconds: 0
      accessCredentials:
        - sshPublicKey:
            source:
              secret:
                secretName: my-pub-key
            propagationMethod:
              qemuGuestAgent:
                users:
                  - evan
      networks:
        - name: default
          pod: {}
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/containerdisks/centos-stream:9
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |-
              #cloud-config
              user: evan
              password: bastion
              chpasswd: { expire: False }
              # Disable SELinux for now, so qemu-guest-agent can write the authorized_keys file
              # The selinux-policy is too restrictive currently, see open bugs:
              #   - https://bugzilla.redhat.com/show_bug.cgi?id=1917024
              #   - https://bugzilla.redhat.com/show_bug.cgi?id=2028762
              #   - https://bugzilla.redhat.com/show_bug.cgi?id=2057310
              bootcmd:
                - setenforce 0
