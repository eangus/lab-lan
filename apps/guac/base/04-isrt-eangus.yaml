---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: guacd
  namespace: guacd
  labels:
    app: guacd
    app.kubernetes.io/managed-by: argocd
# annotations:
#   traefik.ingress.kubernetes.io/router.entrypoints: websecure
#   traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`guac-http.apps.lab.lan`)
      kind: Rule
      services:
        - name: guacd
          port: 8080
