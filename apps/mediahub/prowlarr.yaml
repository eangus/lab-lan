---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config-pvc
  namespace: mediahub
  labels:
    app: prowlarr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: mediahub
  labels:
    app: prowlarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      securityContext:
        fsGroup: 1000
        # Only change ownership if current permissions are wrong
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:latest
          env:
            - name: TZ
              value: "Etc/UTC"
          ports:
            - containerPort: 9696
              name: webui
          volumeMounts:
            - mountPath: /config
              name: config-vol
      volumes:
        - name: config-vol
          persistentVolumeClaim:
            claimName: prowlarr-config-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr-svc
  namespace: mediahub
spec:
  type: ClusterIP
  selector:
    app: prowlarr
  ports:
    - name: webui
      port: 9696
      targetPort: 9696

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prowlarr
  namespace: mediahub
  labels:
    app: prowlarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`prowlarr.apps.lab.lan`)
      kind: Rule
      services:
        - name: prowlarr-svc
          port: 9696
