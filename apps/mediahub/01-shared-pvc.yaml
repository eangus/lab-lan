
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  namespace: mediahub
  labels:
    app: radarr
    app.kubernetes.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-tv
  namespace: mediahub
  labels:
    app: plex
    app.kubernetes.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-movies
  namespace: mediahub
  labels:
    app: plex
    app.kubernetes.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-stage
  namespace: mediahub
  labels:
    app: plex
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 30Gi
