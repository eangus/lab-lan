---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-tv
  namespace: mediahub
  labels:
    app: mediahub
    app.kubernetes.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-movies
  namespace: mediahub
  labels:
    app: mediahub
    app.kubernetes.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-stage
  namespace: mediahub
  labels:
    app: mediahub
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
