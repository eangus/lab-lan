---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: mediahub
  labels:
    app: jellyfin
    app.kubernetes.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: mediahub
  labels:
    app: jellyfin
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    matchLabels:
      app: jellyfin
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        fsGroup: 1000
        # Only change ownership if current permissions are wrong
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: jellyfin
          image: lscr.io/linuxserver/jellyfin:latest
          ports:
            - containerPort: 8096
              name: webui
            - containerPort: 8920
              name: api
          env:
            - name: TZ
              value: America/Chicago
          securityContext:
            capabilities:
              add:
                - SYS_NICE
          volumeMounts:
            - mountPath: /config
              name: jellyfin-config
            - mountPath: /data/movies
              name: media-movies
            - mountPath: /data/tv
              name: media-tv
      imagePullSecrets:
        - name: quay-pull-secret

      volumes:
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media-movies
          persistentVolumeClaim:
            claimName: media-movies
        - name: media-tv
          persistentVolumeClaim:
            claimName: media-tv
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-svc
  namespace: mediahub
spec:
  type: ClusterIP
  selector:
    app: jellyfin
  ports:
    - name: webui
      port: 8096
      targetPort: 8096
    - name: api
      port: 8920
      targetPort: 8920

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: mediahub
  labels:
    app: jellyfin
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`jellyfin.apps.lab.lan`)
      kind: Rule
      services:
        - name: jellyfin-svc
          port: 8096
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-http
  namespace: mediahub
  labels:
    app: jellyfin
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`jellyfin-http.apps.lab.lan`)
      kind: Rule
      services:
        - name: jellyfin-svc
          port: 8096
