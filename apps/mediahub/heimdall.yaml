---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: heimdall-pvc
  namespace: mediahub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heimdall
  namespace: mediahub
  labels:
    app: heimdall
spec:
  replicas: 1
  strategy:
    type: Recreate # Required for ReadWriteOnce storage fallback
  selector:
    matchLabels:
      app: heimdall
  template:
    metadata:
      labels:
        app: heimdall
    spec:
      securityContext:
        fsGroup: 1000
        # Only change ownership if current permissions are wrong
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: heimdall
          image: lscr.io/linuxserver/heimdall:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
          env:
            - name: TZ
              value: America/Chicago
          volumeMounts:
            - name: config-storage
              mountPath: /config
      volumes:
        - name: config-storage
          persistentVolumeClaim:
            claimName: heimdall-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: heimdall
  namespace: mediahub
  labels:
    app: heimdall
    app.kubernetes.io/managed-by: argocd
spec:
  ports:
    - name: heimdall-port
      port: 80
  selector:
    app: heimdall
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: heimdall
  namespace: mediahub
  labels:
    app: heimdall
    app.kubernetes.io/managed-by: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dash.apps.lab.lan`)
      kind: Rule
      services:
        - name: heimdall
          port: 80