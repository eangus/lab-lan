---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: mediahub
  labels:
    app: sonarr
    app.kubernetes.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: mediahub
  labels:
    app: sonarr
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    matchLabels:
      app: sonarr
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:latest
          ports:
            - containerPort: 8989
          env:
            - name: TZ
              value: America/Chicago
          securityContext:
            capabilities:
              add:
                - SYS_NICE
          volumeMounts:
            - mountPath: /config
              name: sonarr-config
            - mountPath: /tv
              name: media-tv
            - mountPath: /downloads
              name: downloads-vol
      imagePullSecrets:
        - name: quay-pull-secret

      volumes:
        - name: sonarr-config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: media-tv
          persistentVolumeClaim:
            claimName: media-tv
        - name: downloads-vol
          persistentVolumeClaim:
            claimName: media-stage

---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: mediahub
  labels:
    app: sonarr
    app.kubernetes.io/managed-by: argocd
spec:
  ports:
    - name: sonarr-port
      port: 8989
  selector:
    app: sonarr

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr
  namespace: mediahub
  labels:
    app: sonarr
    app.kubernetes.io/managed-by: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sonarr.apps.lab.lan`)
      kind: Rule
      services:
        - name: sonarr
          port: 8989
