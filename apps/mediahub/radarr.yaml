---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  namespace: mediahub
  labels:
    app: radarr
    app.kubernetes.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: mediahub
  labels:
    app: radarr
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    matchLabels:
      app: radarr
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: radarr
    spec:
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:latest
          ports:
            - containerPort: 7878
          env:
            - name: TZ
              value: America/Chicago
          securityContext:
            capabilities:
              add:
                - SYS_NICE
          volumeMounts:
            - mountPath: /config
              name: radarr-config
            - mountPath: /movies
              name: media-movies
            - mountPath: /downloads
              name: downloads-vol
      imagePullSecrets:
        - name: quay-pull-secret

      volumes:
        - name: radarr-config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: media-movies
          persistentVolumeClaim:
            claimName: media-movies
        - name: downloads-vol
          persistentVolumeClaim:
            claimName: media-stage

---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: mediahub
  labels:
    app: radarr
    app.kubernetes.io/managed-by: argocd
spec:
  ports:
    - name: radarr-port
      port: 7878
  selector:
    app: radarr

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr
  namespace: mediahub
  labels:
    app: radarr
    app.kubernetes.io/managed-by: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`radarr.apps.lab.lan`)
      kind: Rule
      services:
        - name: radarr
          port: 7878