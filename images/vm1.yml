---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  labels:
    kubevirt.io/os: linux
  name: vm1
spec:
  runStrategy: Always
  template:
    metadata:
      creationTimestamp:
      labels:
        kubevirt.io/domain: vm1
    spec:
      domain:
        cpu:
          cores: 1
        devices:
          disks:
            - disk:
                bus: virtio
              name: disk0
            - disk:
                bus: virtio
                readonly: true
              name: cloudinitdisk
        resources:
          requests:
            memory: 128M
      volumes:
        - name: disk0
          persistentVolumeClaim:
            claimName: cirros
        - cloudInitNoCloud:
            userDataBase64: SGkuXG4=
          name: cloudinitdisk
