---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  creationTimestamp: 2018-07-04T15:03:08Z
  generation: 1
  labels:
    kubevirt.io/os: linux
  name: vm1
spec:
  runStrategy: Always
  template:
    metadata:
      creationTimestamp:
      labels:
        kubevirt.io/domain: vm1
    spec:
      domain:
        cpu:
          cores: 2
        devices:
          disks:
            - disk:
                bus: virtio
              name: disk0
            - cdrom:
                bus: sata
                readonly: true
              name: cloudinitdisk
        machine:
          type: q35
        resources:
          requests:
            memory: 1024M
      # accessCredentials:
      #   - sshPublicKey:
      #       source:
      #         secret:
      #           secretName: my-pub-key
      #       propagationMethod:
      #         qemuGuestAgent:
      #           users:
      #             - evan
      volumes:
        - name: disk0
          persistentVolumeClaim:
            claimName: fedora
        - cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: vm1
              user: evan
              password: bastion
              ssh_pwauth: True
              disable_root: false
          name: cloudinitdisk
